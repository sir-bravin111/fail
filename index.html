<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎂 Sir Bravin Birthday Loading......</title>
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0e1a;
            /* fallback */
            background: radial-gradient(ellipse at 30% 20%, #1a0e2e, #0b0e1a 70%);
            padding: 20px;
        }

        /* ── Main Card ── */
        .birthday-card {
            position: relative;
            width: 100%;
            max-width: 600px;
            padding: 48px 36px 40px;
            border-radius: 56px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 0, 0.15) inset;
            text-align: center;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .birthday-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 58px;
            padding: 2px;
            background: conic-gradient(from 0deg, #f9d423, #f7971e, #f9d423, #ff6b6b, #f9d423);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: rotateBorder 6s linear infinite;
        }

        @keyframes rotateBorder {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Glow orbs ── */
        .birthday-card::after {
            content: '';
            position: absolute;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 200, 50, 0.08), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Content layer ── */
        .card-content {
            position: relative;
            z-index: 2;
        }

        /* ── Emoji / Icon ── */
        .icon-big {
            font-size: 64px;
            display: inline-block;
            animation: float 2.8s ease-in-out infinite;
            filter: drop-shadow(0 8px 24px rgba(255, 200, 0, 0.3));
            margin-bottom: 6px;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0px) scale(1);
            }
            50% {
                transform: translateY(-14px) scale(1.04);
            }
        }

        /* ── Title ── */
        .title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f9d423, #f7971e, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
            text-shadow: 0 0 40px rgba(255, 200, 0, 0.15);
        }

        .subtitle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 28px;
            font-weight: 300;
        }

        /* ── Name Marquee ── */
        .name-marquee-wrapper {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 60px;
            padding: 10px 0;
            margin-bottom: 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.04) inset;
        }

        .name-marquee {
            display: flex;
            white-space: nowrap;
            animation: marquee 12s linear infinite;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 200, 100, 0.25);
        }

        .name-marquee span {
            padding: 0 48px;
            background: linear-gradient(90deg, #f9d423, #ffb347, #f9d423);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 34px;
        }

        .name-marquee .separator {
            color: rgba(255, 255, 255, 0.10);
            -webkit-text-fill-color: rgba(255, 255, 255, 0.10);
        }

        @keyframes marquee {
            0% {
                transform: translateX(0%);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        /* ── Loading Bar ── */
        .loading-section {
            margin-bottom: 28px;
        }

        .loading-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .loading-label .percent {
            color: #f9d423;
            font-weight: 700;
            font-size: 15px;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.04) inset;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(90deg, #f7971e, #f9d423, #ff6b6b, #f9d423);
            background-size: 300% 100%;
            animation: shimmerProgress 2s ease-in-out infinite;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 200, 0, 0.2);
        }

        @keyframes shimmerProgress {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 300% 0%;
            }
        }

        /* ── Loading "sign" / badge ── */
        .sign-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 28px;
            border-radius: 60px;
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.20);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            margin-bottom: 20px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.04);
            transition: all 0.3s ease;
        }

        .sign-badge:hover {
            border-color: rgba(255, 215, 0, 0.40);
            background: rgba(255, 215, 0, 0.12);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.08);
        }

        .sign-badge .sign-icon {
            font-size: 22px;
            animation: pulseIcon 1.6s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .sign-badge .sign-text {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #f9d423, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sign-badge .sign-download {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.3);
            transition: color 0.3s ease;
        }

        .sign-badge:hover .sign-download {
            color: #f9d423;
        }

        /* ── Download Button ── */
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 40px;
            border-radius: 60px;
            border: none;
            font-size: 17px;
            font-weight: 700;
            color: #0b0e1a;
            background: linear-gradient(135deg, #f9d423, #f7971e);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(255, 200, 0, 0.25);
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            background: linear-gradient(135deg, #ffb347, #f9d423);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .download-btn:hover::before {
            opacity: 1;
        }

        .download-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 16px 48px rgba(255, 200, 0, 0.35);
        }

        .download-btn:active {
            transform: scale(0.96);
        }

        .download-btn span,
        .download-btn i {
            position: relative;
            z-index: 2;
        }

        .download-btn .btn-icon {
            font-size: 22px;
        }

        /* ── Confetti Canvas ── */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .birthday-card {
                padding: 32px 20px 32px;
                border-radius: 40px;
            }
            .title {
                font-size: 22px;
            }
            .name-marquee {
                font-size: 24px;
            }
            .name-marquee span {
                font-size: 26px;
                padding: 0 24px;
            }
            .icon-big {
                font-size: 48px;
            }
            .sign-badge {
                padding: 10px 20px;
            }
            .download-btn {
                padding: 14px 28px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── CONFETTI CANVAS ─── -->
    <canvas id="confetti-canvas"></canvas>

    <!-- ─── MAIN CARD ─── -->
    <div class="birthday-card">
        <div class="card-content">

            <!-- Icon -->
            <div class="icon-big">🎂</div>

            <!-- Title -->
            <h1 class="title"> Birthday Loading....</h1>
            <p class="subtitle">✨ prepare some gift 🎁 for Me✨</p>

            <!-- Name Marquee -->
            <div class="name-marquee-wrapper">
                <div class="name-marquee" id="nameMarquee">
                    <!-- populated by JS -->
                </div>
            </div>

            <!-- Loading Bar -->
            <div class="loading-section">
                <div class="loading-label">
                    <span>🎈 Birthday 🎂</span>
                    <span class="percent" id="percentDisplay">70%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <!-- Birthday Loading "Sign" with Download -->
            <div class="sign-badge">
                <span class="sign-icon">⬇️</span>
                <span class="sign-text">Birthday Loading · Download</span>
                <span class="sign-download">⏳</span>
            </div>

            <!-- Download Button -->
            <button class="download-btn" id="downloadBtn">
                <i class="btn-icon">🎁</i>
                <span>Download Celebration</span>
            </button>

        </div>
    </div>

    <!-- ─── JAVASCRIPT ─── -->
    <script>
        (function() {
            'use strict';

            // ── Config ──
            const BIRTHDAY_NAME = 'SIR BRAVINE'; // ← change this to any name
            const LOADING_DURATION = 4000; // ms (4 seconds)

            // ── DOM refs ──
            const marqueeEl = document.getElementById('nameMarquee');
            const progressFill = document.getElementById('progressFill');
            const percentDisplay = document.getElementById('percentDisplay');
            const downloadBtn = document.getElementById('downloadBtn');

            // ── Build marquee content ──
            function buildMarquee() {
                const name = BIRTHDAY_NAME.trim() || 'You';
                const parts = [
                    `🎉 ${name} 🎉`,
                    `birthday loading ${name} 🎂`,
                    `✨ ${name} ✨`,
                    `🥳 ${name} 🥳`,
                    `🎈 ${name} 🎈`,
                    `🎉 ${name} 🎉`
                ];
                // Double the array for seamless loop
                const doubled = [...parts, ...parts];
                marqueeEl.innerHTML = doubled.map(text =>
                    `<span>${text}</span><span class="separator">·</span>`
                ).join('');
            }
            buildMarquee();

            // ── Loading simulation ──
            let progress = 0;
            let intervalId = null;

            function updateLoading() {
                if (progress >= 100) {
                    clearInterval(intervalId);
                    progressFill.style.width = '100%';
                    percentDisplay.textContent = '100%';
                    // trigger confetti burst when done
                    fireConfettiBurst();
                    return;
                }

                // increment with easing (slower at start, faster at end)
                const step = 0.5 + (progress / 100) * 1.2;
                progress = Math.min(progress + step, 100);
                const rounded = Math.round(progress);
                progressFill.style.width = rounded + '%';
                percentDisplay.textContent = rounded + '%';
            }

            function startLoading() {
                progress = 0;
                progressFill.style.width = '0%';
                percentDisplay.textContent = '0%';
                if (intervalId) clearInterval(intervalId);
                intervalId = setInterval(updateLoading, 30);
            }

            // ── Confetti system ──
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            let confettiPieces = [];
            let animationFrame = null;
            let isConfettiRunning = false;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class ConfettiPiece {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height - canvas.height;
                    this.w = 6 + Math.random() * 10;
                    this.h = 4 + Math.random() * 8;
                    this.color = `hsl(${Math.random() * 60 + 30}, 90%, 60%)`;
                    this.speedY = 2 + Math.random() * 4;
                    this.speedX = (Math.random() - 0.5) * 2;
                    this.rotation = Math.random() * 360;
                    this.rotationSpeed = (Math.random() - 0.5) * 6;
                    this.opacity = 0.8 + Math.random() * 0.2;
                    this.life = 1;
                    this.decay = 0.002 + Math.random() * 0.004;
                }
                update() {
                    this.y += this.speedY;
                    this.x += this.speedX + Math.sin(this.y * 0.02) * 0.3;
                    this.rotation += this.rotationSpeed;
                    this.life -= this.decay;
                    if (this.y > canvas.height + 50) {
                        this.reset();
                        this.y = -20 - Math.random() * 40;
                    }
                    if (this.x < -50) this.x = canvas.width + 20;
                    if (this.x > canvas.width + 50) this.x = -20;
                }
                draw(ctx) {
                    ctx.save();
                    ctx.globalAlpha = this.life * this.opacity;
                    ctx.translate(this.x, this.y);
                    ctx.rotate((this.rotation * Math.PI) / 180);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 8;
                    ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
                    ctx.restore();
                }
            }

            function initConfetti(count = 180) {
                confettiPieces = [];
                for (let i = 0; i < count; i++) {
                    const p = new ConfettiPiece();
                    p.y = Math.random() * canvas.height;
                    p.life = 0.5 + Math.random() * 0.5;
                    confettiPieces.push(p);
                }
            }

            function drawConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                for (const p of confettiPieces) {
                    p.update();
                    p.draw(ctx);
                    if (p.life > 0.02) alive = true;
                }
                if (alive || isConfettiRunning) {
                    animationFrame = requestAnimationFrame(drawConfetti);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    isConfettiRunning = false;
                }
            }

            function startConfetti(count = 200) {
                if (isConfettiRunning) {
                    // if already running, just add more
                    for (let i = 0; i < 60; i++) {
                        const p = new ConfettiPiece();
                        p.y = Math.random() * canvas.height * 0.5;
                        p.life = 0.7 + Math.random() * 0.3;
                        confettiPieces.push(p);
                    }
                    return;
                }
                isConfettiRunning = true;
                initConfetti(count);
                if (animationFrame) cancelAnimationFrame(animationFrame);
                drawConfetti();
            }

            function fireConfettiBurst() {
                startConfetti(280);
                // auto-stop after 5 seconds if not already stopped
                setTimeout(() => {
                    // let it naturally fade
                }, 5000);
            }

            // ── Download button action ──
            downloadBtn.addEventListener('click', function() {
                // Show a "downloading" state
                const originalText = this.querySelector('span').textContent;
                const icon = this.querySelector('.btn-icon');
                const textSpan = this.querySelector('span');

                icon.textContent = '⏳';
                textSpan.textContent = 'Downloading…';
                this.disabled = true;
                this.style.opacity = '0.7';

                // Simulate download
                setTimeout(() => {
                    // Restore
                    icon.textContent = '🎁';
                    textSpan.textContent = 'Download Celebration';
                    this.disabled = false;
                    this.style.opacity = '1';

                    // Show a little celebration
                    fireConfettiBurst();

                    // Create a downloadable "birthday certificate" text file
                    const name = BIRTHDAY_NAME.trim() || 'You';
                    const content =
                        `🎂 Happy Birthday ${name}! 🎂\n\n` +
                        `Your celebration is fully loaded!\n` +
                        `✨ Wishing you a fantastic day filled with joy, cake, and laughter!\n\n` +
                        `— Birthday Loading System ✨`;

                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `birthday_${name.toLowerCase()}_celebration.txt`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 2000);
            });

            // ── Start everything ──
            startLoading();

            // Start confetti after a short delay for atmosphere
            setTimeout(() => {
                startConfetti(120);
            }, 600);

            // ── Re-trigger loading on name change (demo: double-click card to reset) ──
            document.querySelector('.birthday-card').addEventListener('dblclick', function() {
                startLoading();
                fireConfettiBurst();
            });

            // ── Keyboard shortcut: press 'R' to reload loading ──
            document.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') {
                    if (!e.ctrlKey && !e.metaKey) {
                        startLoading();
                        fireConfettiBurst();
                    }
                }
            });

            // ── Also fire confetti on first load after 1.5s ──
            setTimeout(() => {
                fireConfettiBurst();
            }, 1500);

            console.log('🎂 Happy Birthday! Double-click the card or press "R" to restart loading.');
        })();
    </script>

</body>
</html>
