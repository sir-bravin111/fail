
<!-- WHATSAPP MESSAGE SIMULATION -->

<section class="card whatsapp-preview">

    <div class="icon">💬</div>

    <h3>WhatsApp Message Simulation</h3>

    <p>
        This is a local visual simulation. It does not send
        or read real WhatsApp messages.
    </p>

    <div class="phone">

        <div class="phone-header">
            <span>‹</span>
            <strong>Security Lab</strong>
            <span>⋮</span>
        </div>

        <div class="chat-area">

            <div class="message received">
                Hello 👋 This is a simulated WhatsApp message.
                <span class="message-time">18:11</span>
            </div>

            <div class="message sent">
                Security simulation is active.
                <span class="message-time">18:11 ✓✓</span>
            </div>

        </div>

    </div>

    <input
        id="whatsappMessage"
        class="target-number"
        type="text"
        placeholder="Type a simulated message..."
    >

    <button onclick="showWhatsAppMessage()">
        SHOW MESSAGE
    </button>

</section>
